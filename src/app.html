<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Cache-busting parameters (?v=2) can be removed after a few weeks once users have cached the new favicons -->
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon.png?v=2" />
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico?v=2" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png?v=2" />
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-theme="my-custom-theme" >
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
